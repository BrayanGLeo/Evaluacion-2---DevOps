name: Deploy Frontend to Amazon EC2

on:
  push:
    branches:
      - "deploy"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend-despacho
          file: ./frontend-despacho/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Iniciar sesión en Docker Hub dentro de la instancia
            echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u "${{ secrets.DOCKER_HUB_USERNAME }}" --password-stdin
            
            # Detener y remover contenedor antiguo si existe
            docker stop innovatech_frontend || true
            docker rm innovatech_frontend || true
            
            # Limpiar imágenes antiguas para optimizar espacio
            docker image prune -f
            
            # Descargar la versión más reciente
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-frontend:latest
            
            # Ejecutar el contenedor mapeando el puerto seguro 8080 de Nginx al puerto 80 público
            docker run -d \
              --name innovatech_frontend \
              --restart unless-stopped \
              -p 80:8080 \
              ${{ secrets.DOCKER_HUB_USERNAME }}/innovatech-frontend:latest