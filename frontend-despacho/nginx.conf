server {
    listen 8080;
    server_name localhost;

    # Entregar la aplicación React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # REVERSE PROXY: Redirigir peticiones de Ventas al Backend
    location /api/v1/ventas {
        proxy_pass http://98.83.74.130:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # REVERSE PROXY: Redirigir peticiones de Despachos al Backend
    location /api/v1/despachos {
        proxy_pass http://98.83.74.130:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Configuración de errores
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}